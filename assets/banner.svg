<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <style>
      @keyframes pulsePath {
        0% { stroke-dashoffset: 1000; opacity: 0.6; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -1000; opacity: 0.6; }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; }
        70% { r: 16px; opacity: 0; }
        100% { r: 4px; opacity: 0; }
      }
      @keyframes floatBubble {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      .animated-wave {
        stroke-dasharray: 200, 30;
        animation: pulsePath 12s linear infinite;
      }
      .ping-dot {
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .floating-pill {
        animation: floatBubble 5s ease-in-out infinite;
      }
      .shimmer-text {
        animation: shimmer 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="16" fill="url(#bgGradient)" />
  <rect width="900" height="300" rx="16" fill="url(#grid)" />

  <!-- Abstract Dynamic Waves (Background Layer) -->
  <g opacity="0.35">
    <path d="M 0 210 Q 150 160, 300 190 T 600 180 T 900 150" fill="none" stroke="#3b82f6" stroke-width="2" class="animated-wave" />
    <path d="M 0 230 Q 200 270, 450 220 T 900 210" fill="none" stroke="#10b981" stroke-width="2" class="animated-wave" style="animation-duration: 8s; animation-direction: reverse;" />
    <path d="M 0 260 C 250 200, 500 280, 900 240" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5" />
  </g>

  <!-- Animated Target Ping / SLA Indicator (Right Side) -->
  <g transform="translate(760, 100)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#10b981" stroke-width="1.5" class="ping-dot" />
    <circle cx="0" cy="0" r="6" fill="#10b981" filter="url(#glow)" />
    <text x="18" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">99.99% SLA</text>
  </g>

  <!-- SLA Metrics Graphic Card in Background -->
  <g transform="translate(680, 160)" opacity="0.85" class="floating-pill">
    <rect width="180" height="75" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="15" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">TARGET COMPLIANCE</text>
    <text x="15" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800">99.995%</text>
    <circle cx="155" cy="45" r="4" fill="#22c55e" />
    <rect x="15" y="60" width="150" height="4" rx="2" fill="#1e293b" />
    <rect x="15" y="60" width="142" height="4" rx="2" fill="url(#glowGradient)" />
  </g>

  <!-- Primary Foreground Content -->
  <!-- Top Category Tag -->
  <g transform="translate(50, 48)">
    <rect width="215" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="26" y="17" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SERVICE LEVEL MANAGEMENT</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="120" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    Awesome <tspan fill="url(#accentGradient)">Service Level Management</tspan>
  </text>

  <!-- Subtitle -->
  <text x="50" y="156" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Curated Hub of Enterprise SaaS Platforms &amp; Sovereign Open-Source SLM &amp; ITSM Tools
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(50, 200)">
    <!-- Pill 1: SLA Enforcement -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="21" fill="#38bdf8" font-size="14">⏱️</text>
      <text x="36" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SLA/OLA Enforcement</text>
    </g>

    <!-- Pill 2: Escalation Workflows -->
    <g transform="translate(192, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="21" fill="#ec4899" font-size="14">⚡</text>
      <text x="36" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Escalation Automation</text>
    </g>

    <!-- Pill 3: Uptime & SLO Tracking -->
    <g transform="translate(384, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="21" fill="#10b981" font-size="14">📊</text>
      <text x="36" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Uptime &amp; SLO Tracking</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="295" width="900" height="5" fill="url(#accentGradient)" />
</svg>